# ========================================================
# Configuração Netlify Deploy - Chapa ARC 07
# ========================================================

[build]
  publish = "."

# --------------------------------------------------------
# Cabeçalhos Globais de Segurança (Security Headers)
# --------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# --------------------------------------------------------
# Política de Cache: Páginas HTML (Sempre Frescas / Sem Cache Preso)
# --------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# --------------------------------------------------------
# Política de Cache: Scripts JavaScript e CSS (Revalidação Automática)
# --------------------------------------------------------
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --------------------------------------------------------
# Política de Cache: Imagens e Mídias Estáticas
# --------------------------------------------------------
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --------------------------------------------------------
# Redirecionamentos Oficiais (Espelhamento do _redirects)
# --------------------------------------------------------
[[redirects]]
  from = "/gestao-arc/dashboard"
  to = "/admin-dashboard.html"
  status = 200

[[redirects]]
  from = "/gestao-arc"
  to = "/admin-login.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
